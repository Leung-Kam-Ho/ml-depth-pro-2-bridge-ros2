[project]
name = "depth_pro_2"
version = "0.1"
description = "Depth Pro 2: Sharp and Temporally Consistent Metric Monocular Depth"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "catkin-pkg>=1.0.0; platform_system == 'Linux'",
  "colcon-common-extensions>=0.3.0; platform_system == 'Linux'",
  "empy==3.3.4; platform_system == 'Linux'",
  "lark>=1.2.2; platform_system == 'Linux'",
  "matplotlib>=3.7; platform_system == 'Linux'",
  "setuptools==72.1.0; platform_system == 'Linux'",

  "av>=14.1; platform_system == 'Darwin'",
  "click; platform_system == 'Darwin'",
  "huggingface-hub>=1.0; platform_system == 'Darwin'",
  "matplotlib; platform_system == 'Darwin'",
  "numpy; platform_system == 'Darwin'",
  "pillow>=11.3; platform_system == 'Darwin'",
  "pillow-heif; platform_system == 'Darwin'",
  "timm>=1.0.27,<1.1; platform_system == 'Darwin'",
  "torch>=2.7; platform_system == 'Darwin'",
]

[project.optional-dependencies]
coreml = ["coremltools==9.0"]

[project.scripts]
depth-pro-2 = "depth_pro_2.cli:main_cli"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "D", "I"]
lint.ignore = ["D1", "D401"]
src = ["src"]
target-version = "py311"

[tool.ruff.lint.pydocstyle]
convention = "google"
